<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="PYTHIA — the Oracle of Delphi, reincarnated as a website. Speak to her. She answers.">
<title>PYTHIA — The Oracle of Delphi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' x='50' text-anchor='middle' font-size='80' fill='%23d4af37' font-family='Georgia'%3E%CE%A9%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(9, 13, 24, 0.88);
    --gold: #d4af37;
    --gold-bright: #f3d26b;
    --text: #cdd6e4;
    --dim: #5c6a82;
    --ok: #7ee787;
    --err: #ff7b72;
    --serif: Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 20%, #0a1020 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--mono);
    overflow: hidden;
  }
  canvas#stars { position: fixed; inset: 0; z-index: 0; }
  #omega-ghost {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 66vh; color: var(--gold);
    opacity: 0.035; user-select: none;
  }
  #terminal {
    position: relative; z-index: 2;
    width: min(880px, 94vw);
    height: min(72vh, 680px);
    margin: 6vh auto 0;
    background: var(--panel);
    border: 1px solid rgba(212, 175, 55, 0.28);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(212, 175, 55, 0.07), 0 24px 80px rgba(0, 0, 0, 0.6);
    display: flex; flex-direction: column;
    backdrop-filter: blur(6px);
  }
  #bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.18);
    font-size: 11px; letter-spacing: 2px; color: var(--dim);
    user-select: none;
  }
  #bar b { color: var(--gold); font-weight: 600; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px 18px 8px;
    font-size: 13.5px; line-height: 1.65;
    scrollbar-width: thin;
    scrollbar-color: rgba(212, 175, 55, 0.25) transparent;
    -webkit-overflow-scrolling: touch;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.25); border-radius: 3px; }
  #log .banner {
    white-space: pre; color: var(--gold); font-size: 11px; line-height: 1.2;
    margin-bottom: 12px; user-select: none;
  }
  .dim { color: var(--dim); }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  .oracle { color: var(--gold-bright); font-family: var(--serif); font-style: italic; font-size: 15px; white-space: pre-wrap; }
  .echo { color: var(--gold); }
  .cmd { color: var(--gold-bright); font-weight: 600; }
  .typing::after {
    content: '…'; display: inline-block;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  #input-line {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px 14px;
    border-top: 1px solid rgba(212, 175, 55, 0.12);
  }
  #prompt { color: var(--gold); white-space: nowrap; }
  #cmd {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--gold-bright); font-family: var(--mono); font-size: 16px;
    caret-color: var(--gold);
  }
  #cmd::placeholder { color: #3a445c; }
  #credit {
    position: relative; z-index: 2;
    text-align: center; margin: 14px auto 0;
    font-size: 11px; letter-spacing: 1.5px; color: var(--dim);
    user-select: none;
  }
  #credit a { color: var(--gold); text-decoration: none; }
  #credit a:hover { color: var(--gold-bright); }
  #verdict {
    position: fixed; inset: 0; z-index: 5;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vw; gap: 22px;
    background: radial-gradient(700px 500px at 50% 50%, rgba(212, 175, 55, 0.12), rgba(5, 7, 13, 0.92) 70%);
    font-family: var(--serif);
    cursor: pointer;
  }
  #verdict.show { display: flex; animation: fadeIn 1.2s ease; }
  #verdict .kicker { letter-spacing: 6px; font-size: 13px; color: var(--dim); font-family: var(--mono); }
  #verdict .big { font-size: clamp(26px, 5vw, 52px); color: var(--gold-bright); font-style: italic; line-height: 1.35; max-width: 900px; }
  #verdict .sub { font-size: 14px; color: var(--dim); font-family: var(--mono); letter-spacing: 2px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .ask { cursor: pointer; }
  .ask:hover { color: var(--gold); }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .typing::after { animation: none; content: '…'; }
    #verdict.show { animation: none; }
  }
  @media (max-width: 560px) {
    #bar .bar-long { display: none; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="omega-ghost">Ω</div>
<div id="terminal">
  <div id="bar"><b>PYTHIA</b> <span><span class="bar-long">THE ORACLE OF DELPHI — </span>TEMPLE TERMINAL</span> <span>v2.0.0</span></div>
  <div id="log" role="log" aria-live="off"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="input-line">
    <span id="prompt">pythia&gt;</span>
    <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="600" placeholder="speak to the oracle…" autofocus aria-label="Speak to the oracle">
  </div>
</div>
<div id="credit">PYTHIA — an oracle by <a href="https://sotiriosgoulas.com" target="_blank" rel="noopener">Sotirios Goulas</a> · γνῶθι σεαυτόν · know thyself</div>
<div id="verdict" role="dialog" aria-label="The Oracle has spoken">
  <div class="kicker">THE ORACLE HAS SPOKEN</div>
  <div class="big" id="verdict-text"></div>
  <div class="sub">γνῶθι σεαυτόν — know thyself</div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
